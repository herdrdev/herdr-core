[package]
name = "ghostty-vt"
version = "0.0.0"
description = "Minimal binding to upstream libghostty-vt (vendor/ghostty)"
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "ghostty-vt"

[lints]
workspace = true

[dependencies]
# zlib-rs for what it writes. See `png_file`.
png = { version = "0.18", features = ["zlib-rs"] }

[dev-dependencies]
flate2 = "1"

[features]
# What other crates' tests need to look inside.
test-hooks = []
